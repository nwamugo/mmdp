  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles/index.css">

  <title>MMDP | Resources</title>
</head>
<body>
<div class="container">
  <div class="row coordination-login">
    <div class="col s12 m12 center-align coordination-login__top">
      <a href="index.html">
        <img src="assets/images/resources/group-2.svg" alt="MMDP">
      </a>
      <div>
        <b>The Managing Migration through <br> Development Programme</b>
      </div>
    </div>

    <form class="col s12 offset-m3 m6 coordination-login__form change-password">
      <div class="coordination-login__form__content">
        <div class="coordination-login__form__group">
          <label for="email"><b>Password</b></label>
          <input placeholder="Enter a new password" required id="password" type="password" class="validate">
        </div>
        <div class="coordination-login__form__group">
          <label for="password"><b>Confirm Password</b></label>
          <input placeholder="Confirm your new password" required id="confirm-password" type="password" class="validate">
        </div>
        <div class="">
          <input type="submit" class="btn" value="Change Password">
        </div>
        <div class="row">
          <div class="input-field col s12 center">
            <a href="/coordination-matrix.html">Return to Login</a>
          </div>
        </div>
    </form>
  </div>
</div>
</div>
