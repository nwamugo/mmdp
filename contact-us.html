<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="favicon.icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.0/css/all.css" integrity="sha384-aOkxzJ5uQz7WBObEZcHvV5JvRW3TUc2rNPA7pe3AwnsUohiw1Vj2Rgx2KSOkF5+h" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles/index.css">
    <link rel="stylesheet" href="assets/styles/common.css">
    <link rel="stylesheet" href="assets/styles/contact-us.css">
    <link rel="stylesheet" href="assets/styles/sidebar.css">
    <title>MMDP | Contact us</title>
  </head>
  <body>

    <!-- navbar section -->
    <header id="header-section" class="row header">
      <!-- content will be loaded dynamically here -->
    </header>

    <main class="contact-us">
      <div class="side__photo">
        <img 
          class="photo" 
          src="assets/images/contact-us/contact-us-side-img.png" 
          alt="mmdp-photo"
          />
      </div>
      <div class="form__wrapper">
        <form class="contact__form" action="">
          <span class="form__heading">
            Contact the MMDP
          </span>
          <span class="form__info desktop">
            Have any questions or comments for the MMDP team? Please fill out the <br />
            form below and our team would get back to you as quickly as possible.
          </span>
          <span class="form__info mobile">
            Have any questions or comments for the MMDP team?  <br />
            Please fill out the form below and our team would get back to you as quickly as possible.
          </span>
          <div class="inputs__wrapper">
            <span class="input__field">
              <input 
                class="input" 
                type="text" 
                name="fullName"
                required
                placeholder="Full name"
                />
            </span>
            <span class="input__field">
              <input 
                class="input" 
                type="email" 
                name="email"
                required
                placeholder="Email" 
                />
            </span>
            <span class="input__field">
              <textarea 
                required
                class="input" 
                name="message"
                placeholder="Message"></textarea>
            </span>
            <span class="input__field">
              <button 
                class="submit__btn" 
                type="submit">
                Submit
              </button>
            </span>
          </div>
        </form>
      </div>
    </main>
    
    <!-- footer section -->
    <footer id ="footer-section" class="footer">
      <!-- content will be loaded dynamically here -->
    </footer>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script type="text/javascript" src="assets/js/common.js"></script>
  </body>
</html>
