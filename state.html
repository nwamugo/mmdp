<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="icon" href="favicon.icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.6.0/css/all.css"
      integrity="sha384-aOkxzJ5uQz7WBObEZcHvV5JvRW3TUc2rNPA7pe3AwnsUohiw1Vj2Rgx2KSOkF5+h"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/styles/index.css" />
    <link rel="stylesheet" href="assets/styles/common.css" />
    <link rel="stylesheet" href="assets/styles/sidebar.css" />
    <link rel="stylesheet" href="assets/styles/animations.css?version=1" />
    <link rel="stylesheet" href="assets/styles/stakeholder-dir-table.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css"
    />
    <title>MMDP | State Map</title>
  </head>

  <body>
    <main>
      <!--Map section here-->

      <!-- Stakeholder directory section -->
      <div class="section section__pillars">
        <div class="thematic-pillars">
          <div class="row thematic-pillars__heading">
            <div class="thematic-pillars__title">
              Stakeholder Directory Listing
            </div>
            <div class="thematic-pillars__desc">
              Search through our stakeholders directory listing to quickly get
              information about the various stakeholders / organisations and
              their activities with respect to curbing irregular migration and
              human trafficking
            </div>
          </div>
        </div>
        <!-- Search Stakeholders Activities -->
        <section class="section search__activities__section">
          <input
            id="search__activities"
            placeholder="Search Stakeholder activities"
          />
          <button class="banner__button animated flashing slow delay-2s">
            Search
          </button>
        </section>
        <section
          id="stakeholder-directory-table"
          class="stakeholder__dir__table"
        >
          <!-- Stakeholder directory table will be loaded dynamically here-->
        </section>
      </div>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.3.1.min.js"
      integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script
      type="text/javascript"
      src="assets/js/stakeholder-dir-table.js"
    ></script>
  </body>
</html>
