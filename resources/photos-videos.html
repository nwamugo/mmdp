<div class="photos-videos">
  <div class="row">
    <div class="col s12 m12 photos-videos__selection-form">
      <div class="valign-wrapper">
        <form>
          <b>Media type:</b> &nbsp;
          <label>
            <input id="photos-checkbox" type="checkbox"/>
            <span>Photos</span>
          </label>
          &nbsp;
          <label>
            <input id="videos-checkbox" type="checkbox"/>
            <span>Videos</span>
          </label>
        </form>
      </div>
    </div>
    <div class="col s12" id="media-container">

    </div>

    <div class="row">
      <div id="media-pagination" class="col m12">
        <!-- pagination -->
      </div>
    </div>
  </div>
  <div id="photos-videos__modal" class="modal">
    <div class="modal-header">
      <div class="modal-close-icon">
          <span id="close-media-player" class="modal-close" aria-label="Close" aria-hidden="true">&times;</span>
      </div>
    </div>
    <div class="modal-content video-modal">
      <div class="modal-previous-button btn-modal">
        <img src=assets/images/common/left-arrow@2x.svg" alt="Previous" height="85" width="85" class="previous-button prevBtn"/>
      </div>
      <div id="modal-video" class="media-player">
        <video class='media-player__video viewer photo-viewer' src='' >
          To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video
        </video>
        <div class="media-player__controls">
          <div class="media-player-progress">
            <div class="media-player-progress__filled"></div>
          </div>
          <button class="media-player__button toggle" title="Toggle Play">►</button>
          <input type="range" name="volume" class="media-player__slider" min="0" max="1" step="0.05" value="1">
          <input type="range" name="playbackRate" class="media-player__slider" min="0.5" max="2" step="0.1" value="1">
          <button data-skip="-10" class="media-player__button">« 10s</button>
          <button data-skip="25" class="media-player__button">25s »</button>
        </div>
      </div>
      <div class="modal-next-button btn-modal">
        <img src=assets/images/common/right-arrow@2x.svg" alt="Next" height="85" width="85" class="next-button nextBtn"/>
      </div>
    </div>
  </div>


  <div id="photos__modal" class="modal">
    <div class="modal-header">
      <div class="modal-close-icon">
        <span id="close-media-player" class="modal-close" aria-label="Close" aria-hidden="true">&times;</span>
      </div>
    </div>
    <div class="modal-content">
      <div id="modal-video" class="photo-modal">
        <div class="modal-previous-button btn-modal">
          <span class="previous-button prevBtn" aria-label="previous" aria-hidden="true">
            <img src=assets/images/common/left-arrow@2x.svg" alt="Previous" height="85" width="85" class="previous-button prevBtn"/>
          </span>
        </div>
        <div><img class='media-player__video viewer photo-viewer' src='' /></div>
        <div class="modal-next-button btn-modal">
          <img src=assets/images/common/right-arrow@2x.svg" alt="Next" height="85" width="85" class="next-button nextBtn"/>
        </div>
      </div>
    </div>
  </div>


</div>
<script type="text/javascript" src="../assets/js/cms/resources/photos-videos.js"></script>
