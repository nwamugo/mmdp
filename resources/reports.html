<div class="main__content-section">
    <div id="research-content" class="row">
        <form id="reports-search-form">
            <input type="text" placeholder="Search reports" class="input research-content__form-input"
                id="reports-search-input">
            <button class="btn-large btn-search" id="reports-search-btn">Search</button>
        </form>
        <!-- Quarterly card -->
        <div class="research-content__card reports-header collapsible" id="quarterly-reports-holder">
            <li>
                <div class="research-content__details">
                    <p class="research-content__essentials  collapsible-header">Quarterly Reports</p>
                </div>
                <div class="research-content__dropdown">
                    <i class="fas fa-angle-right" id="quarterly_dropdown__icon"></i>
                </div>
                <div class="row research-content__devider quarterly-reports">
                    <hr class="content-devider quarterly-reports__devider">
                </div>
                <!-- Card 1 -->
                <div id="quarterlyReports" class=" collapsible-body">
                </div>
            </li>
        </div>


        <!-- Yearly Reports -->
        <div class="research-content__card reports-header collapsible" id="yearly-reports-holder">
            <li>
                <div class="research-content__details">
                    <p class="research-content__essentials  collapsible-header">Yearly Reports</p>
                </div>
                <div class="research-content__dropdown">
                    <i class="fas fa-angle-right" id="yearly_dropdown__icon"></i>
                </div>
                <div class="row research-content__devider quarterly-reports">
                    <hr class="content-devider quarterly-reports__devider">
                </div>
                <!-- Card 1 -->
                <div id="yearlyReports" class=" collapsible-body">
                </div>
            </li>
        </div>

    </div>
</div>
<script src="../assets/js/cms/resources/reports.js"></script>
