<main>
    <!-- Impact factor table -->
    <section id="impact-factor-report-table" class="table">
        <section class="impact-factor-table-web">
            <header class="table-row report-table-header impact-header">
                <label class="report-col-1">
                    <input type="checkbox" name="check" class="check" data-org='impact-factor-check-all' id='impact-factor-check-all' />
                </label>
                <span class="impact-row-split">
                    <div class="impact-table-header-col ">Organization <i class="fas fa-angle-down angle-down-fa-icon"></i></div>
                <div class="impact-table-header-col ">Focus Area <i class="fas fa-angle-down angle-down-fa-icon"></i></div>
                <div class="impact-table-header-col ">LGA <i class="fas fa-angle-down angle-down-fa-icon"></i></div>
                <div class="impact-table-header-col ">Sub theme <i class="fas fa-angle-down angle-down-fa-icon"></i></div>
                <div class="impact-table-header-col ">Thematic Pillar <i class="fas fa-angle-down angle-down-fa-icon"></i></div>
                <div class="impact-table-header-col ">Target % Completion <i class="fas fa-angle-down angle-down-fa-icon"></i></div>
                </span>

            </header>
            <!--Rows will be loaded dynamically here-->
            <div id="impact-factor-data"></div>

            <!--Start Footer-->
            <div class="table__footer_report">
                <tr>
                    <td colspan="7">
                        <button id="impact-factor-export" class="banner__button animated flashing slow delay-2s">
                            <img src="/assets/images/stakeholder-dir/cloud-computing.svg" />Export CSV
                        </button>
                        <span class="footer__right_content">
                            <!-- Dropdown Trigger -->
                            <a class='impact-factor-dropdown-trigger' data-target='impact-factor-entries-per-page'><span id="impact-factor-row-number">10 </span><i class="fas fa-caret-down"></i><a>

                            <!-- Dropdown Structure -->
                            <ul id='impact-factor-entries-per-page' class='dropdown-content'>
                                <!-- Dynamic display goes here -->
                            </ul>
                            <span class="footer-page-entries">Entries per page</span>
                            <span class="page-of-text">Page <span id="impact-factor-current-page">1</span> of
                                <span id="impact-factor-total-page">1</span></span>
                            <button id="impact-factor-previous-page" class="go-back">&#60;</button>
                            <button id="impact-factor-next-page" class="go-forward">&#62;</button>
                        </span>
                    </td>
                </tr>
            </div>
        </section>
        <section id="impact-factor-table-mobile" class="impact-factor-table-mobile">
            <!-- Mobile Table rows come here -->
        </section>
    </section>
    </div>
    <!-- Modal Structure -->
    <div id="modal1" class="modal">
        <div class="modal-content">
            <h5>
                <!-- Content will be loaded dynamically here -->
            </h5>
            <div id="modal__body">
                <table id="impact__details__table" class="impact__details__table">
                    <tbody>
                    <!--Table rows will be loaded dynamically here-->
                    </tbody>
                </table>
                <img class="mmdp__bg__img" src="./assets/images/common/group-2@3x.png" />
            </div>
        </div>
    </div>
</main>
