<main>
    <!-- Partnership Table -->
    <section id="partnership-report-table" class="table">
        <section class="partnership-table-web">
            <header class="table-row header">
                <label class="col-1">
                    <input type="checkbox" name="check" class="check" />
                </label>
                <div class="col-2">Thematic Pillar <i class="fas fa-angle-down fa-xs"></i></div>
                <div class="col-3">Sub theme <i class="fas fa-angle-down fa-xs"></i></div>
                <div class="col-4">LGA <i class="fas fa-angle-down fa-xs"></i></div>
                <div class="col-5">Organizations with Potential Partnership <i class="fas fa-angle-down fa-xs"></i></div>
            </header>
            <!--Rows will be loaded dynamically here-->
            <div id="partnership-report-data"></div>

            <!--Start Footer-->
            <div class="table__footer">
                <tr>
                    <td colspan="7">
                        <button id="export" class="banner__button animated flashing slow delay-2s">
                            <img src="/assets/images/stakeholder-dir/cloud-computing.svg" />Export CSV
                        </button>
                        <span class="footer__right_content">
                            <select id="entries-per-page">
                                <!-- options will be loaded dynamically-->
                            </select>
                            <span>Entries per page</span>
                            <span>Page <span id="current-page">1</span> of
                                <span id="total-page">1</span></span>
                            <button id="previous-page" class="go-back">&#60;</button>
                            <button id="next-page" class="go-forward">&#62;</button>
                        </span>
                    </td>
                </tr>
            </div>
        </section>
        <section id="partnership-table-mobile" class="partnership-table-mobile">
            <!-- Mobile Table rows come here -->
        </section>
    </section>
    </div>
    <!-- Modal Structure -->
    <div id="modal1" class="modal">
        <div class="modal-content">
            <h5>
                <!-- Content will be loaded dynamically here -->
            </h5>
            <div id="modal__body">
                <table id="stakeholder__details__table" class="stakeholder__details__table">
                    <tbody>
                        <!--Table rows will be loaded dynamically here-->
                    </tbody>
                </table>
                <img class="mmdp__bg__img" src="./assets/images/common/group-2@3x.png" />
            </div>
        </div>
    </div>
</main>
